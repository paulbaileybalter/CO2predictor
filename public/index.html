<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#47D7AC">
<title>CO2 Usage Predictor — Balter Brewing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<header>
  <div class="header-in">
    <img class="logo" src="logo.svg" alt="Balter Brewing" width="44" height="44">
    <div class="brand">
      <span class="kicker">Balter Brewing · Supply Planning</span>
      <h1>CO2 Usage Predictor</h1>
    </div>
    <div class="spacer"></div>
    <nav class="actions" aria-label="Actions">
      <button class="btn teal" id="emailBtn">Email version</button>
      <button class="btn" id="copyBtn">Copy order summary</button>
      <button class="btn" id="printBtn">Print</button>
    </nav>
  </div>
  <nav class="jump" aria-label="Sections">
    <a href="#plan">Delivery plan</a>
    <a href="#forecast">Forecast</a>
    <a href="#drivers">What drives usage</a>
    <a href="#invoices">Invoices</a>
    <a href="#readings">Readings</a>
    <a href="#settings">Settings</a>
  </nav>
</header>

<main class="page" id="app" aria-live="polite"><div class="loading">Loading…</div></main>

<footer class="foot">Balter Brewing · CO2 usage predictor · Readings, board uploads and plan changes are saved to the shared store — use Export in Settings for a backup. <a href="/logout">Sign out</a></footer>

<input type="file" id="lbbFile" accept=".xlsx,.xlsm" hidden>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="lbb.js"></script>
<script src="model.js"></script>
<script src="data.js"></script>
<script src="invoices.js"></script>
<script src="app.js"></script>
</body>
</html>
